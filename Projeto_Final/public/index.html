<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · PAVUNA SOFTWARES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <!-- Conteúdo da página -->

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  
<div class="auth-wrap">
  <div class="auth-brand">
    <div class="auth-brand-icon"><img src="images.jpg" alt="Logo"></div>
    <div class="auth-brand-text">
      <strong>NÚCLEO ESCOLAR DA PAVUNA SOFTWARES</strong>
      <span>Controle de Turmas &amp; Instrutores</span>
    </div>
  </div>

  <div class="auth-card">
    <h1>Entrar</h1>
    <p class="auth-sub">Acesse sua conta para continuar.</p>

    <div class="auth-alert" id="loginAlerta"></div>

    <form id="formLogin" novalidate>
      <div class="auth-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@exemplo.com" autocomplete="username">
        <span class="auth-error"></span>
      </div>

      <div class="auth-field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password">
        <span class="auth-error"></span>
      </div>

      <button type="submit" class="auth-submit">Entrar</button>
    </form>

    <p class="auth-footer">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
