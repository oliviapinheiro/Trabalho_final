<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta · PAVUNA SOFTWARES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <!-- Conteúdo da página -->

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
<div class="auth-wrap">
  <div class="auth-brand">
    <div>
<img src="Pavuna Softwares/SENAI_Port_com_assinatura_cor.png" alt="Logo">
         <img src="Pavuna Softwares/SESI_Port_com_assinatura_cor.png" alt="Logo">      
    </div>
    <div class="auth-brand-text">
      <strong>NÚCLEO ESCOLAR DA PAVUNA SOFTWARES</strong>
      <span>Controle de Turmas &amp; Instrutores</span>
    </div>
  </div>

  <div class="auth-card">
    <h1>Criar conta</h1>
    <p class="auth-sub">Preencha os dados abaixo para se cadastrar.</p>

    <div class="auth-alert" id="cadastroAlerta"></div>

    <form id="formCadastro" novalidate>
      <div class="auth-field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome" autocomplete="name">
        <span class="auth-error"></span>
      </div>

      <div class="auth-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@exemplo.com" autocomplete="email">
        <span class="auth-error"></span>
      </div>

      <div class="auth-field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        <span class="auth-error"></span>
      </div>

      <div class="auth-field">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password">
        <span class="auth-error"></span>
      </div>

      <button type="submit" class="auth-submit">Criar conta</button>
    </form>

    <p class="auth-footer">Já tem uma conta? <a href="login.html">Entrar</a></p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
